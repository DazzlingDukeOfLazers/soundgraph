## Managed component dependencies for the generic firmware.
##
## esp_codec_dev is Espressif's codec abstraction; it carries the ES8311 driver used by
## codec boards like the Waveshare ESP32-S3-AUDIO-Board. Fetched by the component manager
## on first build and cached under managed_components/ (gitignored). This is the one
## network-at-build exception in the repository; vendor it before Knobcon demo prep if
## offline builds become critical.
dependencies:
  idf: "^5.5"
  espressif/esp_codec_dev: "^1.3"
  # Speech recognition, on the chip and nowhere else. WakeNet listens for the wake word,
  # MultiNet matches a short list of commands this firmware defines, and the AFE cleans
  # the microphone up before either sees it. No audio leaves the board — which is the
  # whole reason this is here rather than a cloud API with a nicer accuracy figure.
  espressif/esp-sr: "^2"
  # The watch's panel and its touch controller. The wiki calls the display driver
  # CO5300; Waveshare's own BSP drives this glass as an SH8601, and the panel is the
  # thing that has to agree.
  espressif/esp_lcd_sh8601: "^1.0"
  espressif/esp_lcd_touch_ft5x06: "^1.0"
  # The 3.49 bar panel. One component covers the QSPI panel and the touch
  # controller, because on this part they are the same silicon — it answers at
  # 0x3b for touch on its own I2C bus, where the watch needs a separate FT3168.
  espressif/esp_lcd_axs15231b: "^2.0.2"
