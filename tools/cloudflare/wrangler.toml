# SoundGraph's web funnel on Cloudflare. Deploy with `node tools/deploy-web.mjs`
# (exports checked, R2 filled, Worker deployed) or by hand:
#   npx wrangler deploy --config tools/cloudflare/wrangler.toml
name = "soundgraph-web"
main = "worker.js"
compatibility_date = "2026-09-02"

# Route-scoped: this Worker owns mutantfactory.com/soundgraph* — plus
# /examples/patches/*, because the page fetches its patches one directory up from
# itself, mirroring the repository — and nothing else on the domain is touched.
routes = [
    { pattern = "mutantfactory.com/soundgraph*", zone_name = "mutantfactory.com" },
    { pattern = "www.mutantfactory.com/soundgraph*", zone_name = "mutantfactory.com" },
    { pattern = "mutantfactory.com/examples/patches/*", zone_name = "mutantfactory.com" },
    { pattern = "www.mutantfactory.com/examples/patches/*", zone_name = "mutantfactory.com" },
]

# The marketing page (~1 MB all told) rides inside the Worker as static assets.
# editor-web/.assetsignore keeps the 53 MB editor export out of the bundle — that
# lives in R2. run_worker_first because the Worker is the router: public paths carry
# the /soundgraph prefix that the asset names do not.
[assets]
directory = "../../editor-web"
binding = "ASSETS"
run_worker_first = true

# The full editor's home. index.side.wasm (44 MB) is past the 25 MiB static-asset
# limit, which is the whole reason this bucket exists. Filled by tools/deploy-web.mjs.
[[r2_buckets]]
binding = "EDITOR_BUCKET"
bucket_name = "soundgraph-editor"
